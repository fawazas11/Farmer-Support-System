{% extends 'Farmer/Header.html' %}
{% block content %}

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>
    :root {
        --farmer-green: #2e7d32;
        --farmer-light: #f4f9f4;
        --farmer-gradient: linear-gradient(135deg, #2e7d32, #66bb6a);
    }

    .edit-profile-section {
        background-color: var(--farmer-light);
        font-family: 'Plus Jakarta Sans', sans-serif;
        padding: 60px 0;
        min-height: 80vh;
    }

    .profile-card {
        border: none;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.06);
        overflow: hidden;
        transition: transform 0.3s ease;
    }

    .profile-header {
        background: var(--farmer-gradient);
        padding: 35px 20px;
        color: white;
        text-align: center;
    }

    .profile-header i {
        font-size: 2.5rem;
        margin-bottom: 10px;
        display: block;
    }

    .form-label {
        font-weight: 700;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--farmer-green);
        margin-left: 5px;
    }

    .form-control {
        border-radius: 12px;
        padding: 12px 15px;
        border: 1.5px solid #e0e0e0;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        border-color: var(--farmer-green);
        box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.1);
    }

    .btn-update {
        background: var(--farmer-gradient);
        color: white;
        border-radius: 15px;
        padding: 14px 40px;
        border: none;
        font-weight: 700;
        width: 100%;
        box-shadow: 0 10px 20px rgba(46, 125, 50, 0.2);
        transition: all 0.3s ease;
    }

    .btn-update:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 25px rgba(46, 125, 50, 0.3);
        color: white;
    }

    .input-group-text {
        background-color: transparent;
        border-radius: 12px 0 0 12px;
        border: 1.5px solid #e0e0e0;
        color: var(--farmer-green);
    }
</style>

<div class="edit-profile-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <div class="card profile-card">
                    <div class="profile-header">
                        <i class="bi bi-person-gear"></i>
                        <h3 class="fw-bold mb-1">Account Settings</h3>
                        <p class="mb-0 opacity-75">Refine your profile information</p>
                    </div>

                    <div class="card-body p-4 p-lg-5">
                        <form action="" method="post">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" name="txt_name" class="form-control" value="{{ data.farmer_name }}" placeholder="Enter full name" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" name="txt_email" class="form-control" value="{{ data.farmer_email }}" placeholder="name@example.com" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Mobile Number</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-phone"></i></span>
                                    <input type="tel" name="contact_no" class="form-control" value="{{ data.farmer_contact }}" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Residential Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                                    <textarea name="txt_address" class="form-control" rows="3" placeholder="Enter complete address" required>{{ data.farmer_address }}</textarea>
                                </div>
                            </div>

                            <hr class="my-4">
                            <h6 class="fw-bold text-success mb-3"><i class="bi bi-bank me-2"></i>Bank Information</h6>

                            <div class="mb-3">
                                <label class="form-label">Bank Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-building"></i></span>
                                    <input type="text" name="txt_bank" list="bank_list" class="form-control" value="{% if data.farmer_bank %}{{ data.farmer_bank }}{% endif %}" placeholder="Search or Enter Bank Name" required>
                                    <datalist id="bank_list">
                                        <option value="State Bank of India">
                                        <option value="HDFC Bank">
                                        <option value="ICICI Bank">
                                        <option value="Axis Bank">
                                        <option value="Kotak Mahindra Bank">
                                        <option value="IndusInd Bank">
                                        <option value="Bank of Baroda">
                                        <option value="Punjab National Bank">
                                        <option value="Union Bank of India">
                                        <option value="Canara Bank">
                                        <option value="Federal Bank">
                                        <option value="South Indian Bank">
                                        <option value="IDBI Bank">
                                        <option value="Yes Bank">
                                        <option value="Indian Bank">
                                        <option value="Central Bank of India">
                                        <option value="UCO Bank">
                                        <option value="Indian Overseas Bank">
                                    </datalist>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Account Number</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-hash"></i></span>
                                    <input type="text" name="txt_account" class="form-control" value="{% if data.farmer_account %}{{ data.farmer_account }}{% endif %}" placeholder="Enter Account Number" pattern="[0-9]{9,18}" title="9 to 18 digits only" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">IFSC Code</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-upc-scan"></i></span>
                                    <input type="text" name="txt_ifsc" class="form-control" value="{% if data.farmer_ifsc %}{{ data.farmer_ifsc }}{% endif %}" placeholder="Enter IFSC Code" pattern="^[A-Z]{4}0[A-Z0-9]{6}$" title="e.g., SBIN0001234" required>
                                </div>
                            </div>

                            <div class="pt-2">
                                <button type="submit" class="btn-update">
                                    Save Changes <i class="bi bi-arrow-right-short ms-2"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <a href="{% url 'Farmer:Myprofile' %}" class="text-decoration-none text-muted small fw-bold">
                        <i class="bi bi-chevron-left"></i> Discard changes and go back
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>

{% if msg %}
<script>
    // Using a simple alert, but you could upgrade to SweetAlert2 for even better UI
    alert("{{ msg }}");
    window.location = "{% url 'Farmer:Myprofile' %}";
</script>
{% endif %}

{% endblock content %}
