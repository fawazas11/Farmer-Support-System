<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f9f4;
        }
        .card-header {
            background: linear-gradient(135deg, #2e7d32, #66bb6a);
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow">
            <div class="card-header text-white text-center">
                <h4>🔐 Change Password</h4>
            </div>

            <div class="card-body">
                <form action="" method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Old Password</label>
                        <input type="password" name="old_pass" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password"
                               name="new_pass"
                               class="form-control"
                               pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                               title="Must contain at least one number, one uppercase, one lowercase letter, and at least 8 characters"
                               required>
                        <small class="text-muted">
                            Must contain uppercase, lowercase, number & 8 characters
                        </small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Re-type Password</label>
                        <input type="password"
                               name="re_pass"
                               class="form-control"
                               pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                               required>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <button type="submit" class="btn btn-success px-4">
                            Update
                        </button>

                        <a href="{% url 'Farmer:Myprofile' %}" class="btn btn-outline-danger px-4">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

{% if msg %}
<script>
    alert("{{msg}}");
    window.location = "{% url 'Farmer:Myprofile' %}";
</script>
{% endif %}
