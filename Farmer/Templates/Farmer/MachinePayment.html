<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Payment</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <style>
        body{
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            font-family: 'Segoe UI', sans-serif;
        }

        .payment-card{
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,.2);
            overflow: hidden;
        }

        .payment-header{
            background: linear-gradient(135deg, #2e7d32, #66bb6a);
            color: white;
            text-align: center;
            padding: 20px;
        }

        .payment-header i{
            font-size: 40px;
        }

        .form-control{
            border-radius: 12px;
        }

        .pay-btn{
            background: linear-gradient(135deg, #2e7d32, #66bb6a);
            border: none;
            border-radius: 30px;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            color: white;
        }

        .pay-btn:hover{
            background: #1b5e20;
        }

        .card-icons i{
            font-size: 45px;
            margin: 10px;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="col-md-6 col-lg-5">

        <div class="card payment-card">
            <div class="payment-header">
                <i class="fa fa-credit-card"></i>
                <h3 class="mt-2">Secure Payment</h3>
                <p class="mb-0">Krishi Bhavan Services</p>
            </div>

            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Card Number</label>
                        <input type="text" id="credit-card" name="txtacno"
                               class="form-control"
                               placeholder="XXXX XXXX XXXX XXXX"
                               maxlength="19" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Card Holder Name</label>
                        <input type="text" name="txtname"
                               class="form-control"
                               placeholder="Name on Card"
                               pattern="[a-zA-Z ]{3,15}" required>
                    </div>

                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label">Expiry (MM/YY)</label>
                            <input type="text" id="credit-card-exp"
                                   name="txtexpdate"
                                   class="form-control"
                                   placeholder="MM/YY"
                                   maxlength="5" required>
                        </div>

                        <div class="col-6 mb-3">
                            <label class="form-label">CVV</label>
                            <input type="text" id="credit-card-ccv"
                                   name="txtccv"
                                   class="form-control"
                                   placeholder="XXX"
                                   maxlength="3" required>
                        </div>
                    </div>

                    <div class="alert alert-success text-center fw-bold">
                        Total Amount: ₹ {{ machine.machine.machine_price }}
                    </div>

                    <button type="submit" class="btn pay-btn w-100">
                        Make Payment
                    </button>
                </form>

                <div class="text-center card-icons mt-4">
                    <i class="fa fa-cc-visa text-dark"></i>
                    <i class="fa fa-cc-mastercard text-primary"></i>
                    <i class="fa fa-cc-paypal text-danger"></i>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const card = document.getElementById("credit-card");
    const exp = document.getElementById("credit-card-exp");
    const cvv = document.getElementById("credit-card-ccv");

    card.addEventListener("input", () => {
        card.value = card.value.replace(/\D/g, '').match(/.{1,4}/g)?.join(' ') || '';
    });

    exp.addEventListener("input", () => {
        exp.value = exp.value.replace(/\D/g, '').match(/.{1,2}/g)?.join('/').slice(0,5) || '';
    });

    cvv.addEventListener("input", () => {
        cvv.value = cvv.value.replace(/\D/g, '').slice(0,3);
    });
});
</script>

</body>
</html>
