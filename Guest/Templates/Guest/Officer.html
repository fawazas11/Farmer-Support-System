<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Officer Registration</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(to right, #a8e063, #56ab2f);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }

        .form-container {
            background: #fff;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 700px;
            transition: transform 0.3s ease;
        }
        .form-container:hover { transform: translateY(-5px); }

        .form-title {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 700;
            color: #2c3e50;
        }

        .btn-primary { background: #28a745; border: none; }
        .btn-primary:hover { background: #218838; }

        .btn-secondary:hover { background: #6c757d; color: #fff; }

        .form-control:focus {
            border-color: #28a745;
            box-shadow: 0 0 5px rgba(40, 167, 69, 0.5);
        }

        label { font-weight: 500; }

        .preview-img {
            margin-top: 10px;
            max-height: 150px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2 class="form-title">🌾 Officer Registration</h2>
    <form action="" method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}

        <!-- Name -->
        <div class="mb-3">
            <label for="txtname" class="form-label"><i class="bi bi-person-fill"></i> Name</label>
            <input required type="text" name="txt_name" class="form-control" id="txtname" placeholder="Enter Name"
                   pattern="^[A-Z][a-zA-Z ]*$"
                   title="Name allows only alphabets, spaces, and first letter must be capital">
            <div class="invalid-feedback">Please enter a valid name (First letter capital, only letters and spaces).</div>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label for="txt_email" class="form-label"><i class="bi bi-envelope-fill"></i> Email</label>
            <input required type="email" name="txt_email" class="form-control" id="txt_email" placeholder="Enter Email">
            <div class="invalid-feedback">Please enter a valid email address.</div>
        </div>

        <!-- Contact -->
        <div class="mb-3">
            <label for="contact_no" class="form-label"><i class="bi bi-telephone-fill"></i> Contact Number</label>
            <input required type="tel" name="contact_no" class="form-control" id="contact_no" placeholder="Enter Phone Number"
                   pattern="[0-9]{10}">
            <div class="invalid-feedback">Please enter a valid 10-digit phone number.</div>
        </div>

        <!-- Address -->
        <div class="mb-3">
            <label for="txt_address" class="form-label"><i class="bi bi-geo-alt-fill"></i> Address</label>
            <input required type="text" name="txt_address" class="form-control" id="txt_address" placeholder="Enter Address">
        </div>

        <!-- Photo -->
        <div class="mb-3">
            <label for="photo" class="form-label"><i class="bi bi-camera-fill"></i> Photo</label>
            <input required type="file" name="photo" class="form-control" id="photo" accept="image/*">
            <img id="photoPreview" class="preview-img d-none" alt="Photo Preview">
        </div>

        <!-- District -->
        <div class="mb-3">
            <label for="sel_district" class="form-label"><i class="bi bi-building"></i> District</label>
            <select name="sel_district" id="sel_district" class="form-select">
                <option value="">---Select---</option>
                {% for i in district %}
                    <option value="{{i.id}}">{{i.district_name}}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Place -->
        <div class="mb-3">
            <label for="sel_place" class="form-label"><i class="bi bi-geo-fill"></i> Place</label>
            <select name="sel_place" id="sel_place" class="form-select">
                <option value="">---Select---</option>
            </select>
        </div>

        <!-- ID Proof -->
        <div class="mb-3">
            <label for="id_proof" class="form-label"><i class="bi bi-file-earmark-person-fill"></i> ID Proof</label>
            <input required type="file" name="id_proof" class="form-control" id="id_proof" accept="image/*,application/pdf">
            <img id="idPreview" class="preview-img d-none" alt="ID Preview">
        </div>

        <!-- Password -->
        <div class="mb-3">
            <label for="password" class="form-label"><i class="bi bi-lock-fill"></i> Password</label>
            <input required type="password" name="password" class="form-control" id="password"
                   pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                   title="Must contain at least one number, one uppercase, one lowercase letter, and at least 8 characters">
        </div>

        <!-- Confirm Password -->
        <div class="mb-3">
            <label for="re_password" class="form-label"><i class="bi bi-lock-fill"></i> Confirm Password</label>
            <input required type="password" name="re_password" class="form-control" id="re_password"
                   pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}">
        </div>

        <!-- Buttons -->
        <div class="d-flex justify-content-center gap-3 mt-4">
            <input type="submit" value="Register" class="btn btn-primary btn-lg">
            <input type="button" value="Cancel" class="btn btn-secondary btn-lg" onclick="window.history.back();">
            <a href="{% url 'Guest:Login' %}" class="btn btn-info btn-lg">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </a>
            <a href="{% url 'Guest:index' %}" class="btn btn-outline-success btn-lg">
                <i class="bi bi-house"></i> Home
            </a>
        </div>
    </form>
</div>

<!-- jQuery -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<!-- AJAX for District → Place & Image Preview -->
<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        let cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            let cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
var csrftoken = getCookie('csrftoken');

$("#sel_district").change(function () {
    var did = $(this).val();
    var ur = "{% url 'Guest:ajaxplace' %}";
    $.ajax({
        url: ur,
        data: { did: did },
        headers: {'X-CSRFToken': csrftoken},
        success: function (data) {
            $("#sel_place").html(data);
        },
    });
});

// Password confirmation
$("form").submit(function(e){
    var pwd = $("#password").val();
    var repwd = $("#re_password").val();
    if(pwd !== repwd){
        alert("Passwords do not match!");
        e.preventDefault();
    }
});

// Bootstrap validation
(function () {
  'use strict'
  var forms = document.querySelectorAll('form')
  Array.prototype.slice.call(forms).forEach(function (form) {
      form.addEventListener('submit', function (event) {
          if (!form.checkValidity()) {
              event.preventDefault()
              event.stopPropagation()
          }
          form.classList.add('was-validated')
      }, false)
  })
})();

// Live preview for Photo
$("#photo").change(function(){
    const file = this.files[0];
    if(file){
        const reader = new FileReader();
        reader.onload = function(e){
            $("#photoPreview").attr("src", e.target.result).removeClass("d-none");
        }
        reader.readAsDataURL(file);
    }
});

// Live preview for ID Proof (only images)
$("#id_proof").change(function(){
    const file = this.files[0];
    if(file && file.type.startsWith("image/")){
        const reader = new FileReader();
        reader.onload = function(e){
            $("#idPreview").attr("src", e.target.result).removeClass("d-none");
        }
        reader.readAsDataURL(file);
    } else {
        $("#idPreview").addClass("d-none");
    }
});
</script>

{% if msg %}
<script>
    alert("{{msg}}");
    window.location="{% url 'Guest:Officer' %}";
</script>
{% endif %}

</body>
</html>
