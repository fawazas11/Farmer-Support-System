<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
</head>
<body>
    <form action="" method="post" enctype="multipart/form-data">
        {% csrf_token %} 
        <table border="2">
            <tr>
                <td>Name</td>
                <td><input required type="text" name="txt_name" placeholder="Name"  class="form-control" name="txtname" id="txtname"
                                  title="Name Allows Only Alphabets,Spaces and First Letter Must Be Capital Letter"
                                  pattern="^[A-Z]+[a-zA-Z ]*$"></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="text" name="txt_email" placeholder="Enter you Email" required></td>
            </tr>
            <tr>
                <td>Contact</td>
                <td><input required type="number" name="contact_no"placeholder="Enter your Contact" pattern="[7-9]{1}[0-9]{9}"
                                  title="Phone number with 7-9 and remaining 9 digits with 0-9"></td>
            </tr>
            <tr>
                <td>Adress</td>
                <td><input type="text" name="txt_address"placeholder="Enter your Adress" required></td>
            </tr>
            <tr>
                <td>Gender</td>
                <td><input type="radio" name="gender" value="Male">Male
      			<input type="radio" name="gender" value="Female">Female
            </td>
            </tr>
            <tr>
                <td>DOB</td>
                <td><input type="date" name="dob"></td>
            </tr>
            <tr>
                <td>District</td>
               <td><select name="sel_district" id="sel_district">
                <option value="">---select---</option>
                {% for i in district %}
                <option value="{{i.id}}">{{i.district_name}}</option>
                {% endfor %}
               </select></td>
            </tr>
            <tr>
                <td>Place</td>
                <td><select name="sel_place" id="sel_place">
                    <option value="">---select---</option>
                </select></td>
            </tr>
            <tr>
                <td>Photo</td>
                <td><input  required type="file" name="photo" required></td>
            </tr>
            <tr>
                <td>Password</td>
                <td>,<input type="password"  name="password" placeholder="Enter your password"      pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                                  title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"
                                  required></td>
            </tr>
            <tr>
                <td>Re-Password</td>
                <td><input type="password" name="repassword"
                          pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                                  title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"
                                  required></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                
                    <input type="submit" name="signup" value="Sign Up">
                    <input type="submit" name="cancel" value="Cancel">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    $("#sel_district").change(function () {
        var did = $(this).val();
        
        var ur = "{% url 'Guest:ajaxplace' %}"
        $.ajax({
            url: ur,
            data: { did: did, },
            success: function (data) {
                $("#sel_place").html(data);
            },
        });
    });
</script>

{% if msg %}
<script>
    alert("{{msg}}")
    window.location="{% url 'Guest:Signup' %}"
</script>
{% endif %}
