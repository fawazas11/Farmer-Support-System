{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

    <style>
        body {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-card {
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            width: 100%;
            max-width: 420px;
        }

        .login-header {
            background: linear-gradient(135deg, #2e7d32, #66bb6a);
            color: white;
            text-align: center;
            padding: 25px;
        }

        .login-header h3 {
            margin: 0;
            font-weight: 700;
        }

        .form-control {
            border-radius: 30px;
        }

        .btn-login {
            background: linear-gradient(135deg, #388e3c, #81c784);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 30px;
            padding: 10px;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #1b5e20, #4caf50);
        }

        .form-label {
            font-weight: 600;
            color: #2e7d32;
        }
    </style>
</head>

<body>

    <div class="login-card bg-white">
        <div class="login-header">
            <h3><i class="fas fa-sign-in-alt"></i> Login</h3>
            <p class="mb-0">Welcome back! Please login</p>
        </div>

        <div class="p-4">
            <form action="" method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input type="email" name="txt_email" class="form-control" placeholder="Enter your email" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" name="txt_password" class="form-control" placeholder="Enter your password"
                        pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                        title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 characters"
                        required>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-login">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>

                    <a href="{% url 'Guest:index' %}" class="btn btn-secondary"
                        style="text-decoration: none; border-radius: 30px;">
                        <i class="fas fa-arrow-left"></i> Back To Homepage
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    {% if msg %}
    <script>
        alert("{{ msg }}");
        window.location = "{% url 'Guest:Login' %}";
    </script>
    {% endif %}

</body>

</html>
