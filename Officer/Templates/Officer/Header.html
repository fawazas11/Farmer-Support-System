{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>KisanMitra</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Roboto:wght@400;500;700;900&display=swap"
        rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link rel="stylesheet" href="lib/animate/animate.min.css" />
    <link href="{% static 'Main/lib/lightbox/css/lightbox.min.css' %}'" rel="stylesheet">
    <link href="{% static 'Main/lib/owlcarousel/assets/owl.carousel.min.css' %}" rel="stylesheet">


    <!-- Customized Bootstrap Stylesheet -->
    <link href="{% static 'Main/css/bootstrap.min.css' %}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="{% static 'Main/css/style.css' %}" rel="stylesheet">
</head>

<body>



    <!-- Topbar Start -->
    <div class="container-fluid topbar bg-light px-5 d-none d-lg-block">
        <div class="row gx-0 align-items-center">
            <div class="col-lg-8 text-center text-lg-start mb-2 mb-lg-0">
                <div class="d-flex flex-wrap">
                    <a href="#" class="text-muted small me-4"><i
                            class="fas fa-map-marker-alt text-primary me-2"></i>Find A Location</a>
                    <a href="tel:+01234567890" class="text-muted small me-4"><i
                            class="fas fa-phone-alt text-primary me-2"></i>+01234567890</a>
                    <a href="mailto:example@gmail.com" class="text-muted small me-0"><i
                            class="fas fa-envelope text-primary me-2"></i>Example@gmail.com</a>
                </div>
            </div>
            <div class="col-lg-4 text-center text-lg-end">
                <div class="d-inline-flex align-items-center" style="height: 45px;">
                    <a href="#"><small class="me-3 text-dark"><i
                                class="fa fa-user text-primary me-2"></i>Register</small></a>
                    <a href="#"><small class="me-3 text-dark"><i
                                class="fa fa-sign-in-alt text-primary me-2"></i>Login</small></a>
                    <div class="dropdown">
                        <a href="#" class="dropdown-toggle text-dark" data-bs-toggle="dropdown"><small><i
                                    class="fa fa-home text-primary me-2"></i> My Dashboard</small></a>
                        <div class="dropdown-menu rounded shadow-sm border-0">
                            <a href="{% url 'Officer:Myprofile' %}" class="dropdown-item"><i
                                    class="fas fa-user-alt me-2 text-success"></i> My Profile</a>
                            <a href="{% url 'Officer:Notifications' %}" class="dropdown-item"><i
                                    class="fas fa-bell me-2 text-success"></i> Notifications</a>
                            <a href="{% url 'Officer:Changepassword' %}" class="dropdown-item"><i
                                    class="fas fa-cog me-2 text-success"></i> Account Settings</a>
                            <div class="dropdown-divider"></div>
                            <a href="{% url 'Officer:logout' %}" class="dropdown-item text-danger"><i
                                    class="fas fa-power-off me-2"></i> Log Out</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Topbar End -->

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-2 sticky-top">
        <div class="container-fluid">

            <!-- Brand -->
            <a class="navbar-brand fw-bold text-success" href="index.html">
                🌾 AgriCare
            </a>

            <!-- Toggle Button -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navbar Content -->
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav ms-auto align-items-center gap-2">

                    <a href="{% url 'Officer:HomePage' %}" class="nav-link active">Home</a>
                    <a href="{% url 'Officer:Addproduct' %}" class="nav-link">Add Product</a>
                    <a href="{% url 'Officer:ViewBooking' %}" class="nav-link">Crop Booking</a>
                    <a href="{% url 'Officer:ViewMachineBooking' %}" class="nav-link">Machine Booking</a>
                    <a href="{% url 'Officer:ViewRequest' %}" class="nav-link">Insurance Request</a>
                    <a href="{% url 'Officer:logout' %}" class="nav-link">Logout</a>


                    <!-- Buttons -->


                    <a href="{% url 'Officer:Myprofile' %}" class="btn btn-success rounded-pill px-3">
                        👤 Profile
                    </a>

                </div>
            </div>
        </div>
    </nav>

    {% block content %}
    {% endblock content %}


    <!-- Back to Top -->
    <a href="#" class="btn btn-primary btn-lg-square rounded-circle back-to-top"><i class="fa fa-arrow-up"></i></a>


    <!-- JavaScript Libraries -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'Main/lib/wow/wow.min.js ' %}"></script>
    <script src="{% static 'Main/lib/easing/easing.min.js' %}"></script>
    <script src="{% static 'Main/lib/waypoints/waypoints.min.js' %}"></script>
    <script src="{% static 'Main/lib/counterup/counterup.min.js' %}"></script>
    <script src="{% static 'Main/lib/lightbox/js/lightbox.min.js' %}"></script>
    <script src="{% static 'Main/lib/owlcarousel/owl.carousel.min.js' %}"></script>


    <!-- Template Javascript -->
    <script src="{% static 'Main/js/main.js' %}"></script>
</body>

</html>
