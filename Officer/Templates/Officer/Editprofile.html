{% extends 'Officer/Header.html' %}
{% load static %}
{% block content %}

<div class="container-fluid py-5" style="background: linear-gradient(135deg, #f8f9fa 0%, #e8f5e9 100%); min-height: 90vh;">
    <div class="container">
        <!-- Section Title -->
        <div class="text-center mb-5 animate__animated animate__fadeInDown">
            <h1 class="display-5 fw-bold text-success mb-2">
                <i class="fas fa-user-edit me-3"></i>Update Profile
            </h1>
            <p class="lead text-muted">Keep your contact information up to date.</p>
            <div class="mx-auto" style="width: 60px; height: 4px; background: #28a745; border-radius: 2px;"></div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card border-0 shadow-lg animate__animated animate__zoomIn" style="border-radius: 20px; overflow: hidden;">
                    <div class="card-header bg-success p-4 border-0">
                        <div class="d-flex align-items-center">
                            <div class="bg-white text-success rounded-circle p-3 me-3">
                                <i class="fas fa-id-card fa-lg"></i>
                            </div>
                            <h4 class="mb-0 text-white fw-bold">Profile Details</h4>
                        </div>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <form action="" method="post" class="needs-validation" novalidate>
                            {% csrf_token %}
                            
                            <div class="mb-4">
                                <label for="name" class="form-label text-muted small fw-bold text-uppercase">Full Name</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-0"><i class="fas fa-user text-success"></i></span>
                                    <input required type="text" name="txt_name" id="name" class="form-control border-light bg-light py-2" value="{{data.officer_name}}" placeholder="Enter your full name">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="email" class="form-label text-muted small fw-bold text-uppercase">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-0"><i class="fas fa-envelope text-success"></i></span>
                                    <input required type="email" name="txt_email" id="email" class="form-control border-light bg-light py-2" value="{{data.officer_email}}" placeholder="example@mail.com">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="contact" class="form-label text-muted small fw-bold text-uppercase">Contact Number</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-0"><i class="fas fa-phone text-success"></i></span>
                                    <input required type="number" name="contact_no" id="contact" class="form-control border-light bg-light py-2" value="{{data.officer_contact}}" placeholder="10-digit number">
                                </div>
                            </div>

                            <div class="mb-5">
                                <label for="address" class="form-label text-muted small fw-bold text-uppercase">Residential Address</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-0"><i class="fas fa-map-marker-alt text-success"></i></span>
                                    <textarea required name="txt_address" id="address" class="form-control border-light bg-light py-2" rows="3" placeholder="Enter your detailed address">{{data.officer_address}}</textarea>
                                </div>
                            </div>

                            <div class="d-grid gap-3">
                                <button type="submit" class="btn btn-success btn-lg py-3 fw-bold shadow-sm transition-hover" style="border-radius: 12px; font-size: 1.1rem;">
                                    <i class="fas fa-check-circle me-2"></i>Save Changes
                                </button>
                                <a href="{% url 'Officer:Myprofile' %}" class="btn btn-link text-muted py-2 text-decoration-none transition-hover">
                                    <i class="fas fa-arrow-left me-1"></i> Back to Profile
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .transition-hover {
        transition: all 0.3s ease;
    }
    .transition-hover:hover {
        transform: translateY(-2px);
        opacity: 0.9;
    }
    .form-control:focus {
        background-color: #fff !important;
        border-color: #28a745 !important;
        box-shadow: 0 0 0 0.25rem rgba(40, 167, 69, 0.1);
    }
    .input-group-text { padding-right: 15px; }
</style>

{% if msg %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    Swal.fire({
        icon: 'success',
        title: 'Updated!',
        text: '{{ msg }}',
        confirmButtonColor: '#28a745'
    }).then(() => {
        window.location = "{% url 'Officer:Myprofile' %}";
    });
</script>
{% endif %}

{% endblock content %}
