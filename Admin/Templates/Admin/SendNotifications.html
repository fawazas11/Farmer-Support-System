<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
</head>
<body>
    <form action="" method="post">
        {% csrf_token %}
        <table border="2">
            <tr>
                <td>Title</td>
                <td><input type="text" name="txt_title"></td>
            </tr>
            <tr>
                <td>Details</td>
                <td><input type="text" name="txt_details"></td>
            </tr>
            <tr>
                
                <td colspan="2 " align="center">
                    <input type="submit" value="Submit">
                </td>
            </tr>
        </table>
        <table border="2">
            <tr>
                <td>SINp</td>
                <td>Title</td>
                <td>Details</td>
                <td>Date</td>
                <td>Action</td>
            </tr>
            {% for i in Officer %}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{i.notification_title}}</td>
                <td>{{i.notification_details}}</td>
                <td>{{i.notification_date}}</td>
                <td>
                    <a href="{% url 'Admin:Delnot' i.id %}">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </table>

    </form>
</body>
</html>
{% if msg %}
<script>
alert("{{msg}}")
window.location="{% url 'Admin:Notifications'  %}"
</script>
{% endif %}
