<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f7fa;
        }
        .card {
            margin-top: 50px;
            border-radius: 10px;
        }
        .badge-approved {
            background-color: green;
        }
        .badge-rejected {
            background-color: red;
        }
        .badge-pending {
            background-color: orange;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card shadow p-4">
        <h3 class="text-center mb-4">Claim Details</h3>

        <table class="table table-bordered">
            <tr>
                <th>Claim Name</th>
                <td>{{ claim.claim_name }}</td>
            </tr>

            <tr>
                <th>Details</th>
                <td>{{ claim.claim_details }}</td>
            </tr>

            <tr>
                <th>Amount</th>
                <td>{{ claim.claim_amount }}</td>
            </tr>

            <tr>
                <th>File</th>
                <td>
                    <a href="{{ claim.claim_file.url }}" target="_blank" class="btn btn-primary btn-sm">
                        View File
                    </a>
                </td>
            </tr>

            <tr>
                <th>Status</th>
                <td>
                    {% if claim.claim_status == 1 %}
                        <span class="badge badge-approved text-white p-2">Approved</span>
                    {% elif claim.claim_status == 2 %}
                        <span class="badge badge-rejected text-white p-2">Rejected</span>
                    {% else %}
                        <span class="badge badge-pending text-white p-2">Pending</span>
                    {% endif %}
                </td>
            </tr>
        </table>
    </div>
</div>

</body>
</html>
