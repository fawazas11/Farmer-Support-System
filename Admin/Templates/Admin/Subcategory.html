<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Subcategory
    </title>
</head>
<body>
    <form action="" method="post">
        {% csrf_token %} 
      <table>
        <tr>
            <td>Category</td>
            <td><select name="sel_category" id="">
                <option value="">---select---</option>
                {% for i in sub %}
                <option value="{{i.id}}"
                {% if i.id == editdata.category_id %} selected
                {% endif %}
                >{{i.category_name}}</option>
                {% endfor %}
            </select>
        </tr>
        <tr>
            <td>Subcategory</td>
            <td><input type="text" name="txt_name" value="{{editdata.sub_name}}"></td>
        </tr>
        <tr>
            <td><input type="submit" value="Submit"></td>
            <td></td>
        </tr>
      </table>
      <table>
        <tr>
            <td>SI NO</td>
            <td>Category</td>
            <td>Subcategory</td>
            <td>Action</td>
        </tr>
         {% for i in subdata %}
        <tr>
            <td>{{forloop.counter}}</td>
            <td>{{i.category.category_name}}</td>
            <td>{{i.sub_name}}</td>
            <td><a href="{% url 'Admin:delsub' i.id %}">Delete</a></td>
            <td><a href="{% url 'Admin:editsub' i.id %}">Edit</a></td>
        </tr>
        {% endfor %}
      </table>
    </form>
</body>
</html>
{% if msg %}
<script>
alert("{{msg}}")
window.location="{% url 'Admin:Subcategory'  %}"
</script>
{% endif %}
