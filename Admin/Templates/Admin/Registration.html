<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="post">
        {% csrf_token %} 
        <table border="2" >
            <tr>
                <td>Name</td>
                <td><input required type="text" name="txt_registration_1" value="{{editdata.admin_name}}"
                title="Name Allows Only Alphabets,Spaces and First Letter Must Be Capital Letter"
                                  pattern="^[A-Z]+[a-zA-Z ]*$"></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="text" name="txt_email_1" value="{{editdata.admin_email}}" required></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password" name="txt_password" value="{{editdata.admin_password}}"
                                  pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                                  title="Must contain at least one number and one uppercase and l
                                  owercase letter, and at least 8 or more characters"
                                  required></td>
            </tr>
            <tr>
                
                <td colspan="2" align="center">
                    <input type="submit" value="Register">
                </td>
            </tr>
        </table>
        <table>
            <tr>
                <td>SI NO</td>
                <td>Name</td>
                <td>Email</td>
                <td>Password</td>
                <td>Action</td>
            </tr>
            
                {% for i in Admin %}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{i.admin_name}}</td>
                <td>{{i.admin_email}}</td>
                <td>{{i.admin_password}}</td>
                <td><a href="{% url 'Admin:delreg' i.id %}">Delete</a>
                    <a href="{% url 'Admin:editreg' i.id %}">Edit</a>
                </td>
            
            </tr>
            
            {% endfor %}
        </table>
    </form>
    
</body>
</html>
{% if msg %}
<script>
alert("{{msg}}")
window.location="{% url 'Admin:Registration'  %}"
</script>
{% endif %}
